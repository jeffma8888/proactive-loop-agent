[project]
name = "proactive-loop-agent"
version = "0.1.1"
description = "A proactivity layer for agentic loops: scan working context, synthesize ranked goals, dispatch to a resilient plan-act-check execution loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jeffma8888" }]
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
pla = "proactive_loop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # pytest-xdist parallelizes the suite (see `addopts` below). It is declared
    # because suite wall-clock had become a build risk, not a taste preference:
    # the fresh-clone time climbed 61s -> ~106s in three days and at 120s the
    # release check flips to BROKEN. Measured on this 12-CPU box, 88.80s serial
    # -> 25.72s under `-n auto` (3.45x) with all 3334 tests passing unchanged;
    # on a 2-core runner (`-n 2`) it is still 52.52s (1.69x), so the win
    # survives the smaller CI machines too. Dev-group only: never imported by
    # `src/`, and the runtime dependency set stays pydantic-only.
    "pytest-xdist>=3.6",
    # mypy is the machine oracle for the "fully type-hinted" README claim.
    # It is LOCKED (not run via `uv run --with mypy`) so `make typecheck` and
    # the CI type step run a reproducible, pinned checker from the project
    # venv, fully offline. Base config lives in [tool.mypy] below.
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n auto` distributes the suite across every logical CPU via pytest-xdist (see
# the dev-group comment for the measured 3.45x). Setting it HERE, rather than in
# a Makefile recipe or a CI step, is deliberate: every call site -- `make test`,
# `make check`, the CI step, a bare `uv run pytest`, an IDE runner -- inherits
# the same parallelism, so no invocation is silently left serial. Coverage is
# still strictly opt-in and MUST NOT appear here; the three subprocess oracles
# in tests/test_iter52_behavior.py pass an explicit `-n0` to opt back OUT.
addopts = "-q -n auto"

# Every warning the suite raises is an ERROR. A printed-and-forgotten
# DeprecationWarning is the one failure class that stays silent until the day it
# is a hard break, on a repo whose whole thesis is "resilient by design" and which
# already gates itself with strict mypy, a locked install and a multi-interpreter
# CI matrix. Declared HERE for the same reason as `addopts` above -- and never as
# `-W error` in a recipe -- because the ini is the single declaration point: `make
# test`, `make check`, the CI step, a bare `uv run pytest` and an IDE runner all
# inherit it, so no invocation is silently left permissive and there is no second
# spelling to drift from.
#
# The blast radius is bounded by a fact about this repo's CI rather than by
# optimism: CI installs with `uv sync --locked` and `uv.lock` pins every
# dependency exactly, so an upstream release cannot reach a graded run at all. A
# new warning can only arrive when this repo bumps the lock or adds an interpreter
# to the matrix -- precisely the two moments a maintainer wants to be told.
#
# The list is EXACTLY one element and it is `error`: no `ignore::` carve-out, now
# or speculatively. A test that legitimately needs to OBSERVE a warning uses the
# PER-TEST escape hatch (`@pytest.mark.filterwarnings("default")` around
# `warnings.catch_warnings(record=True)`), so tolerating one warning never
# requires widening this list for the whole suite. Any future narrowly-scoped
# ignore must therefore be a visible, reviewed edit here AND to its oracle.
filterwarnings = ["error"]

[tool.coverage.run]
# Measure only our package, with branch coverage so the report reflects
# untested branches (not just lines). This is opt-in via `make cov`; it is
# deliberately NOT wired into pytest `addopts`, so a bare `uv run pytest`
# stays fast and byte-identical (no coverage columns).
source = ["proactive_loop"]
branch = true

[tool.coverage.report]
# Show missing line/branch numbers so the report is actionable, and exclude
# boilerplate that carries no behavior worth measuring. `exclude_lines` is a
# convenience only -- no test depends on it.
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '\.\.\.',
]

[tool.mypy]
# The machine oracle for the "fully type-hinted" README claim (`make typecheck`,
# and the byte-identical CI step). Now `strict`, because DEFAULT-mode mypy does
# not check the signature or body of an UNANNOTATED function at all -- i.e. the
# old default-mode config was structurally blind to the exact defect class the
# README claim is about, and it did in fact pass a fully unannotated parameter
# (`cli.py::_dispatch_goal(client)`) as "Success".
#
# Measured when `strict` was first flipped on (history, still accurate):
#   default mode                        -> 0 errors
#   --strict                            -> 38 errors
#   --strict, by code                   -> 35 `type-arg`, plus exactly 3 others
#   --strict --allow-any-generics       -> exactly 3 errors, fixed in that commit
# So ONE flag owned 35 of the 38 errors, and `disallow_any_generics` was deferred
# for one cycle because deferring it alone bought every other strict flag --
# including the load-bearing `disallow_untyped_defs` -- for a 3-error fix.
#
# That deferral is now CLOSED: all 35 bare-generic sites (`cli.py` 19,
# `loop/tools.py` 15, `loop/executor.py` 1) are parameterized, so `strict = true`
# stands UNQUALIFIED below at zero errors and NO strict component is switched off
# anywhere in this file. The key is DELETED rather than set to `true` on purpose:
# `strict` already supplies it, so the config carries no line whose only job is to
# name an exemption. Do NOT weaken a strict flag here, and do NOT add an
# error-surfacing flag without also fixing what it surfaces.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# botocore is the transport SDK under boto3 (the OPTIONAL, lazily-imported
# `bedrock` provider) and ships no bundled type stubs. Scope the missing-stub
# allowance to it ALONE -- never a blanket global `ignore_missing_imports` --
# so the rest of the tree keeps full stub enforcement.
module = "botocore.*"
ignore_missing_imports = true
