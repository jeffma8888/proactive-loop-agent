[project]
name = "proactive-loop-agent"
version = "0.1.1"
description = "A proactivity layer for agentic loops: scan working context, synthesize ranked goals, dispatch to a resilient plan-act-check execution loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jeffma8888" }]
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
pla = "proactive_loop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
