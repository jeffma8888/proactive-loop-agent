[project]
name = "proactive-loop-agent"
version = "0.1.1"
description = "A proactivity layer for agentic loops: scan working context, synthesize ranked goals, dispatch to a resilient plan-act-check execution loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "jeffma8888" }]
dependencies = [
    "pydantic>=2.7",
]

[project.scripts]
pla = "proactive_loop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # mypy is the machine oracle for the "fully type-hinted" README claim.
    # It is LOCKED (not run via `uv run --with mypy`) so `make typecheck` and
    # the CI type step run a reproducible, pinned checker from the project
    # venv, fully offline. Base config lives in [tool.mypy] below.
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proactive_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# Measure only our package, with branch coverage so the report reflects
# untested branches (not just lines). This is opt-in via `make cov`; it is
# deliberately NOT wired into pytest `addopts`, so a bare `uv run pytest`
# stays fast and byte-identical (no coverage columns).
source = ["proactive_loop"]
branch = true

[tool.coverage.report]
# Show missing line/branch numbers so the report is actionable, and exclude
# boilerplate that carries no behavior worth measuring. `exclude_lines` is a
# convenience only -- no test depends on it.
show_missing = true
exclude_lines = [
    'pragma: no cover',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
    '\.\.\.',
]

[tool.mypy]
# The machine oracle for the "fully type-hinted" README claim (`make typecheck`,
# and the byte-identical CI step). Now `strict`, because DEFAULT-mode mypy does
# not check the signature or body of an UNANNOTATED function at all -- i.e. the
# old default-mode config was structurally blind to the exact defect class the
# README claim is about, and it did in fact pass a fully unannotated parameter
# (`cli.py::_dispatch_goal(client)`) as "Success".
#
# Re-measured at the commit that flipped this on (the previous comment here was
# from the iter-86 bite and was stale in BOTH of its numbers):
#   default mode                        -> 0 errors  (the old comment promised 6)
#   --strict                            -> 38 errors (the old comment said 42)
#   --strict, by code                   -> 35 `type-arg`, plus exactly 3 others
#   --strict --allow-any-generics       -> exactly 3 errors, all fixed here
# So ONE flag owned 35 of the 38 errors: deferring `disallow_any_generics` alone
# buys every other strict flag -- including the load-bearing
# `disallow_untyped_defs` -- for a 3-error fix.
#
# `disallow_any_generics` is therefore the ONE deliberately deferred flag; the
# remaining bare-generic sites (`cli.py` 19, `loop/tools.py` 15,
# `loop/executor.py` 1) are queued as a roadmap row, not forgotten. Do NOT
# weaken any other strict flag here, and do NOT add an error-surfacing flag
# without also fixing what it surfaces.
python_version = "3.12"
strict = true
disallow_any_generics = false

[[tool.mypy.overrides]]
# botocore is the transport SDK under boto3 (the OPTIONAL, lazily-imported
# `bedrock` provider) and ships no bundled type stubs. Scope the missing-stub
# allowance to it ALONE -- never a blanket global `ignore_missing_imports` --
# so the rest of the tree keeps full stub enforcement.
module = "botocore.*"
ignore_missing_imports = true
