# Continuous integration for proactive-loop-agent.
#
# The product's core claim is that the whole L2 -> L1 -> L0 stack runs fully
# offline and deterministically. CI therefore asserts BOTH halves of that claim
# on every push: the test suite passes, AND the end-to-end demo still completes
# with no API key and no live model. Network access is used only to install the
# locked dependency set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.12"; prove both the floor and the next release.
        python-version: ["3.12", "3.13"]
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. `actions/checkout` defaults to a
      # depth-1 clone, but this repo TESTS ITS OWN GIT HISTORY: GitActivityCollector
      # runs `git log -n15` against examples/fixture_workspace, and the fixture
      # behavior tests assert the exact header `## git_commit (15)`. Under a shallow
      # clone only ONE commit is reachable, so those tests fail in CI while passing
      # on every developer machine. Full history makes CI match a real clone.
      - name: Check out the repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails the build if uv.lock has drifted from pyproject.toml, so
      # a dependency change can never land without a regenerated lockfile.
      - name: Install the locked dependency set
        run: uv sync --locked

      - name: Run the test suite (offline)
        run: uv run pytest

      # The README advertises the package as "fully type-hinted"; this step is
      # the permanent oracle for that claim -- the whole src/proactive_loop
      # package must type-check clean under the locked mypy on every push, and so
      # must the two examples/ consumer scripts the steps below EXECUTE
      # (`check_run.py`, `check_autonomy.py`). Both are named as explicit paths:
      # `examples/fixture_workspace` exists to be imperfect, so a directory-form
      # `mypy examples` would red this build for no defect. Byte-identical to the
      # same step of `make check`.
      - name: Type-check the package and the graded examples (mypy, locked)
        run: uv run mypy src/proactive_loop examples/check_run.py examples/check_autonomy.py

      # A green suite with a broken demo is still a broken product: the suite
      # exercises units and CLI surfaces, the demo exercises the whole stack.
      - name: Run the end-to-end demo (offline)
        run: make demo

      - name: Assert the demo produced a slate and artifacts
        run: |
          test -f .pla_runs/slate.json
          ls .pla_runs/run-*/artifacts/*.md > /dev/null

      # The two assertions above are pure EXISTENCE checks, so a demo that
      # published a semantically wrong slate still passes them. This step is the
      # first one that READS what the demo published: every goal in the slate
      # cites `sources` the synthesizer filled in as free text, and `verify`
      # resolves each citation against the scan snapshot the same `pla run` wrote.
      #
      # WHY the demo is the one caller allowed to ARM this gate: `verify` is
      # reporting-only by default because several collectors are mtime-driven, so
      # against a LATER snapshot an unresolved source can mean staleness rather
      # than fabrication. `--fail-on-unresolved` is documented for a caller that
      # knows its pair is same-run -- and `make demo` writes slate and snapshot in
      # ONE invocation, so that precondition is structural here, not merely
      # likely. A fabricated citation in the published slate is now a red build.
      #
      # Byte-identical to the same step of `make check` (pinned by
      # tests/test_iter102_behavior.py + tests/test_iter110_behavior.py), and
      # placed BEFORE the self-scan so that scan stays the final graded step.
      - name: Verify the demo slate's cited sources resolve against its own snapshot
        run: uv run pla verify --slate .pla_runs/slate.json --snapshot .pla_runs/snapshot.json --fail-on-unresolved

      # The ratchet's CONSUMER, and the second gate to read what the demo wrote
      # rather than merely that it exists. `make demo` above ran `pla run
      # --snapshot`, which PRODUCED `.pla_runs/snapshot.json`; until this step
      # existed `--baseline` had 37 prose mentions and zero executable consumers,
      # so the subtraction this product advertises was never demonstrated by the
      # gates that grade it.
      #
      # WHY same-run rather than a committed baseline: a checked-in snapshot needs
      # a refresh rule nobody owns and rots into a blindfold. Produced and consumed
      # in ONE gate run, there is nothing to refresh -- the same structural argument
      # the step above relies on.
      #
      # WHY the fixture workspace and never `.`: this gate writes `.pla_runs/` into
      # the repo root BETWEEN produce and consume, so a root-scoped round trip would
      # see its own artifacts as new `recent_file` signals and be red for everyone.
      # `--fail-over 0` demands an EMPTY residual, so a non-empty one means
      # `--snapshot` and `--baseline` have stopped agreeing on their six shared
      # identity keys. Proven in both directions: 0 residual here, and deleting one
      # signal from the baseline exits 5 naming count and budget.
      #
      # Byte-identical to the same step of `make check` (pinned by
      # tests/test_iter102_behavior.py + tests/test_iter110_behavior.py), and
      # placed BEFORE the self-scan so that scan stays the final graded step.
      - name: Round-trip the same-run snapshot through the --baseline ratchet
        run: uv run pla signals --workspace examples/fixture_workspace --baseline .pla_runs/snapshot.json --fail-over 0

      # The COUNT-BUDGET sibling of the gate below, and the third ratchet. The
      # kind gate can only arm a kind that is ZERO in this repo, so the kinds
      # that are merely supposed to stay SMALL are beyond its reach; this step
      # budgets them instead, and until it existed `--fail-over` had zero
      # consumers anywhere.
      #
      # WHY it names four collectors rather than budgeting the whole census: a
      # full-view budget also counts `working_tree`, which emits one signal per
      # changed path (measured: 75 signals with a clean tree, 76 with one
      # uncommitted edit), so it would be red for every developer mid-edit while
      # CI -- always a fresh checkout -- stayed green. These four are the whole
      # set that is both state-independent and unsaturated: `todo`,
      # `recent_file` and `git_commit` sit ON their caps so a budget over them
      # could never fire, `lockfile_drift` is mtime-driven, and
      # `working_tree`/`git_state`/`git_stash` are local state.
      #
      # The view totals 9 in BOTH populations this gate runs in (this working
      # tree and a fresh clone), and the boundary is strict, so 9 passes and the
      # 10th signal reds the build. Proven in both directions: `--fail-over 9`
      # exits 0, `--fail-over 8` exits 5 naming count and budget.
      #
      # Byte-identical to the same step of `make check` (pinned by
      # tests/test_iter102_behavior.py + tests/test_iter110_behavior.py), and
      # placed BEFORE the self-scan so that scan stays the final graded step.
      - name: Budget the state-independent signal kinds the kind gate cannot arm
        run: uv run pla signals --workspace . --collector notes --collector ci_config --collector dependencies --collector test_posture --fail-over 9

      # The product dogfoods its own enforcement mode: `--fail-on-kind KIND`
      # exits 5 when a named signal kind is present, and the README sells that
      # exit code as the channel a CI step branches on -- so THIS is that step.
      # The armed set is deliberately the state-independent, must-never-appear
      # subset: a red build here means the checkout is broken (a conflict marker,
      # unparseable Python, a committed secret file, a Markdown link pointing at a
      # path the filesystem disproves), never that someone has work in progress.
      # Kept byte-for-byte identical to the last step of `make check` by
      # tests/test_iter102_behavior.py + tests/test_iter110_behavior.py,
      # so the local and CI gates cannot silently diverge.
      - name: Self-scan the checkout for must-never-appear signal kinds
        run: uv run pla signals --workspace . --fail-on-kind merge_conflict --fail-on-kind syntax_error --fail-on-kind secret_file --fail-on-kind broken_link
