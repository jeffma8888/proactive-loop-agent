# Continuous integration for proactive-loop-agent.
#
# The product's core claim is that the whole L2 -> L1 -> L0 stack runs fully
# offline and deterministically. CI therefore asserts BOTH halves of that claim
# on every push: the test suite passes, AND the end-to-end demo still completes
# with no API key and no live model. Network access is used only to install the
# locked dependency set.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python = ">=3.12"; prove both the floor and the next release.
        python-version: ["3.12", "3.13"]
    steps:
      # fetch-depth: 0 is REQUIRED, not tidiness. `actions/checkout` defaults to a
      # depth-1 clone, but this repo TESTS ITS OWN GIT HISTORY: GitActivityCollector
      # runs `git log -n15` against examples/fixture_workspace, and the fixture
      # behavior tests assert the exact header `## git_commit (15)`. Under a shallow
      # clone only ONE commit is reachable, so those tests fail in CI while passing
      # on every developer machine. Full history makes CI match a real clone.
      - name: Check out the repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails the build if uv.lock has drifted from pyproject.toml, so
      # a dependency change can never land without a regenerated lockfile.
      - name: Install the locked dependency set
        run: uv sync --locked

      - name: Run the test suite (offline)
        run: uv run pytest

      # The README advertises the package as "fully type-hinted"; this step is
      # the permanent oracle for that claim -- the whole src/proactive_loop
      # package must type-check clean under the locked mypy on every push.
      - name: Type-check the package (mypy, locked)
        run: uv run mypy src/proactive_loop

      # A green suite with a broken demo is still a broken product: the suite
      # exercises units and CLI surfaces, the demo exercises the whole stack.
      - name: Run the end-to-end demo (offline)
        run: make demo

      - name: Assert the demo produced a slate and artifacts
        run: |
          test -f .pla_runs/slate.json
          ls .pla_runs/run-*/artifacts/*.md > /dev/null
